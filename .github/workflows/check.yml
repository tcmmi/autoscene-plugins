# Checks a pull request (spec C5.4, A3 R28): plan.py's tests, the rules of a
# pull request, a build of each new plugin version from its source
# (build-plugin.yml, with the permission diff in its job summary), and an
# index that takes them.
#
# It runs on pull_request, never pull_request_target: a fork's run gets a
# read-only token and no secrets, and the owner approves it before it starts.
#
# The ruleset requires `test`, `plan` and `index`. The builds run once per new
# version, so their check names change with each pull request; `index` runs
# unless the run is cancelled, and fails when a job before it failed or was
# skipped without reason.
name: check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Also lints the workflows (scripts/lint_workflows.py) and runs
      # publish.yml dry (scripts/dry_run.py): under CI those tests fail
      # instead of skipping when PyYAML is missing.
      - name: Test plan.py and lint the workflows
        run: python3 -I scripts/test_plan.py

  plan:
    name: plan
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      versions: ${{ steps.plan.outputs.versions }}
      any: ${{ steps.plan.outputs.any }}
      index: ${{ steps.plan.outputs.index }}
    steps:
      # The merge commit and its first parent, the base it merges into.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: What this pull request adds
        id: plan
        run: python3 -I scripts/plan.py changes --base HEAD^1 --head HEAD

  asp:
    name: asp
    needs: plan
    if: needs.plan.outputs.index == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: catalog
          persist-credentials: false
      - name: Read catalog.toml
        id: settings
        run: python3 -I catalog/scripts/plan.py settings
      - name: Check out AutoScene at asp.rev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tcmmi/AutoScene
          ref: ${{ steps.settings.outputs.asp_rev }}
          path: autoscene
          filter: blob:none
          persist-credentials: false
      - name: Build asp
        id: build
        working-directory: autoscene
        env:
          REV: ${{ steps.settings.outputs.asp_rev }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$REV" ]; then
            echo "::error::The AutoScene checkout isn't catalog.toml's asp.rev."
            exit 1
          fi
          # GitHub serves a commit by its id from any fork; asp.rev counts
          # only on AutoScene's own main.
          git fetch --quiet --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$REV" refs/remotes/origin/main; then
            echo "::error::catalog.toml's asp.rev $REV isn't a commit on tcmmi/AutoScene's main."
            exit 1
          fi
          rustup toolchain install
          cargo build --locked --release -p as-plugin --features cli --bin asp
          echo "sha256=$(sha256sum target/release/asp | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Upload asp
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tool-asp-index
          path: autoscene/target/release/asp
          if-no-files-found: error

  build:
    name: build (${{ matrix.id }} ${{ matrix.version }})
    needs: plan
    if: needs.plan.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.versions) }}
    # build-plugin.yml's attest job asks for these, and GitHub checks a call's
    # grants against every job it holds. With attest false that job is
    # skipped, so no job of a pull request's run gets an id-token.
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-plugin.yml
    with:
      id: ${{ matrix.id }}
      version: ${{ matrix.version }}
      attest: false

  index:
    name: index
    needs: [test, plan, asp, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASP: tool/asp
      CHANGES: ${{ needs.plan.outputs.index }}
    steps:
      - name: Every job before this one passed
        env:
          TEST: ${{ needs.test.result }}
          PLAN: ${{ needs.plan.result }}
          ASP_RESULT: ${{ needs.asp.result }}
          BUILD: ${{ needs.build.result }}
          ANY: ${{ needs.plan.outputs.any }}
        run: |
          ok=true
          [ "$TEST" = success ] || ok=false
          [ "$PLAN" = success ] || ok=false
          [ "$ASP_RESULT" = success ] || { [ "$ASP_RESULT" = skipped ] && [ "$CHANGES" = false ]; } || ok=false
          [ "$BUILD" = success ] || { [ "$BUILD" = skipped ] && [ "$ANY" = false ]; } || ok=false
          if [ "$ok" != true ]; then
            echo "::error::test $TEST, plan $PLAN, asp $ASP_RESULT, build $BUILD: the index needs them all."
            exit 1
          fi
          if [ "$CHANGES" != true ]; then
            echo "Nothing in this pull request goes into the index."
          fi
      - name: Check out
        if: needs.plan.outputs.index == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read catalog.toml
        if: needs.plan.outputs.index == 'true'
        id: settings
        run: python3 -I scripts/plan.py settings
      - name: Download asp
        if: needs.plan.outputs.index == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tool-asp-index
          path: tool
      - name: Check asp
        if: needs.plan.outputs.index == 'true'
        env:
          SHA256: ${{ needs.asp.outputs.sha256 }}
        run: |
          echo "$SHA256  $ASP" | sha256sum --check --strict -
          chmod +x "$ASP"
      # The index made here is a check and is thrown away: nothing of it is
      # published, so the packages are taken by name.
      - name: Download the packages
        if: needs.plan.outputs.any == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: asp-*
          path: packages
      # download-artifact puts a lone artifact straight into packages/; the
      # index takes each package from its own asp-<id>-<version>/ folder.
      - name: One folder per package
        if: needs.plan.outputs.any == 'true'
        run: |
          for file in packages/*.asp; do
            [ -f "$file" ] || continue
            folder="packages/asp-$(basename "$file" .asp)"
            mkdir -p "$folder"
            mv "$file" "$folder/"
          done
      # A copy of the index takes the new packages and withdrawn.toml, is
      # signed with a key made for this run only, and must verify as the
      # next index: valid, and with every entry of the one before.
      - name: Make the next index with a throwaway key
        if: needs.plan.outputs.index == 'true'
        env:
          VERSIONS: ${{ needs.plan.outputs.versions }}
          DAYS: ${{ steps.settings.outputs.days }}
        run: |
          work="$RUNNER_TEMP/index"
          mkdir -p "$work" packages
          previous=()
          if [ -f site/index.json ]; then
            cp site/index.json "$work/index.json"
            previous=(--previous site/index.json)
          else
            "$ASP" catalog new "$work/index.json"
          fi
          python3 -I scripts/plan.py add "$ASP" "$work/index.json" packages \
            --catalog "$GITHUB_REPOSITORY" --versions "$VERSIONS"
          python3 -I scripts/plan.py withdrawn withdrawn.toml "$work/withdrawn.json"
          "$ASP" catalog withdrawn "$work/index.json" "$work/withdrawn.json"
          "$ASP" catalog bump "$work/index.json" --days "$DAYS"
          "$ASP" keygen --unencrypted "$work/key"
          CATALOG_KEY="$(cat "$work/key/asp.key")" "$ASP" catalog sign "$work/index.json" --key-env CATALOG_KEY
          "$ASP" catalog verify "$work/index.json" "${previous[@]}" --online-key "$(cat "$work/key/author.pub")"
