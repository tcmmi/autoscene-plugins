# Settings for the catalog's CI.

# The uv version CI checks locks with. It moves together with the uv that
# AutoScene uses, because uv refuses a lock with a newer schema.
uv = "0.13.7"

# The tcmmi/AutoScene commit that CI builds the `asp` tool from. It must be a
# commit on AutoScene's GitHub `main` that has `asp catalog` and the catalog's
# keys: publish.yml and resign.yml check the index against the keys compiled
# into `asp`, and with none compiled in that check fails.
asp = { rev = "8d43aa80fb4658322116c9c3967bfb6c10b61fbc" }

# How many days a signature on the index counts. CI signs it again every week,
# with `asp catalog bump --days` set from this value. From 15 to 31: with 15 or
# more a missed week still leaves a week, and AutoScene refuses an index that
# lives longer than 31.
days = 30
